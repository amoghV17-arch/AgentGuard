version: "3.9"

services:
  agentguard:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentguard:agentguard_dev@postgres:5432/agentguard
      - REDIS_URL=redis://redis:6379
      - ALLOW_BYPASS_MODE=false
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard_dev
      POSTGRES_DB: agentguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
